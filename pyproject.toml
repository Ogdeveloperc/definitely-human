[project]
name = "definitely-human"
version = "0.1.0"
description = "Offline, explainable AI-text detector (MELD-based) with sentence-level heatmaps"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
dependencies = [
    "torch>=2.7",
    "transformers>=4.48",
    "safetensors>=0.4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "python-docx>=1.1",
    "pypdf>=5.0",
    "huggingface-hub>=0.25",
    "numpy>=1.26",
    "pyarrow>=15",
]

[project.scripts]
definitely-human = "definitely_human.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/definitely_human"]

# RTX 50xx (Blackwell, sm_120) needs a CUDA 12.8+ build of torch.
# macOS uses the default PyPI wheels (MPS/CPU).
[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = ["pytest>=8", "datasets>=3.0", "scikit-learn>=1.5"]
