name: Build Windows installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      smoke_test:
        description: "Install on a Windows runner and analyze sample files (CPU)"
        type: boolean
        default: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # attach the installer to the GitHub release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Version
        id: v
        shell: bash
        run: echo "version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Stage app files
        shell: pwsh
        run: |
          $app = "build/app"
          New-Item -ItemType Directory -Force $app, "$app/bin" | Out-Null
          Copy-Item pyproject.toml, uv.lock, .python-version, README.md, LICENSE, installer/install.ps1 $app
          Copy-Item -Recurse backend, assets $app
          Get-ChildItem -Recurse -Directory -Filter __pycache__ $app | Remove-Item -Recurse -Force
          Invoke-WebRequest https://github.com/astral-sh/uv/releases/download/0.12.23/uv-x86_64-pc-windows-msvc.zip -OutFile uv.zip
          Expand-Archive uv.zip -DestinationPath uvtmp
          Copy-Item uvtmp/uv.exe "$app/bin/uv.exe"

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc /DAppVersion=${{ steps.v.outputs.version }} installer/DefinitelyHuman.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/*.exe

      - name: Smoke test (silent install + CPU analysis)
        if: github.event_name == 'push' || inputs.smoke_test
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist/*.exe | Select-Object -First 1
          Start-Process $exe.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=C:\DefinitelyHuman" -Wait
          $py = "C:\DefinitelyHuman\.venv\Scripts\python.exe"
          if (-not (Test-Path $py)) { Get-Content C:\DefinitelyHuman\*.log -ErrorAction SilentlyContinue; throw "venv missing" }
          & $py -m definitely_human.cli doctor
          & $py -m definitely_human.cli --device cpu check tests/fixtures/sample.docx --domain essay
          if ($LASTEXITCODE -ne 0) { throw "docx check failed" }
          & $py -m definitely_human.cli --device cpu check tests/fixtures/sample.pdf --domain paper
          if ($LASTEXITCODE -ne 0) { throw "pdf check failed" }

      - name: Scanned PDF via docTR OCR
        if: github.event_name == 'push' || inputs.smoke_test
        shell: pwsh
        run: |
          & C:\DefinitelyHuman\.venv\Scripts\python.exe -c "from definitely_human import docparse; t,m=docparse.extract('s.pdf', open('tests/fixtures/scanned.pdf','rb').read()); print(m); print(t[:400]); assert 'grandfather' in t and 'algorithmic bias' in t"
          if ($LASTEXITCODE -ne 0) { throw "OCR failed" }

      - name: Smoke test (the desktop shortcut path - pythonw serve + HTTP API)
        if: github.event_name == 'push' || inputs.smoke_test
        shell: pwsh
        run: |
          $pyw = "C:\DefinitelyHuman\.venv\Scripts\pythonw.exe"
          Start-Process $pyw -ArgumentList "-m","definitely_human.cli","--device","cpu","serve","--no-browser" -WorkingDirectory C:\DefinitelyHuman
          $ready = $false
          for ($i = 0; $i -lt 120; $i++) {
            Start-Sleep 5
            try { $s = Invoke-RestMethod http://127.0.0.1:8765/api/status; if ($s.ready) { $ready = $true; break } } catch {}
          }
          if (-not $ready) { Get-Content C:\DefinitelyHuman\data\*.log; throw "server never became ready" }
          Invoke-WebRequest http://127.0.0.1:8765/ -UseBasicParsing | Out-Null
          $out = curl.exe -s -N -F "file=@tests/fixtures/sample.docx" -F "domain=essay" http://127.0.0.1:8765/api/analyze-file
          $last = ($out -split "`n" | Where-Object { $_ -ne "" })[-1] | ConvertFrom-Json
          if (-not $last.result) { Write-Host $out; throw "analysis via HTTP failed" }
          Write-Host ("AI share: {0}  words: {1}" -f $last.result.document.ai_share, $last.result.document.n_words)

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
